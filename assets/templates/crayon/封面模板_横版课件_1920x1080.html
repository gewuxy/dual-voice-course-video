<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>横版课件封面模板（2026-10-14 按 L8 实证比例回填）</title>
<style>
/* ============ 蜡笔色板 ============ */
:root{
  --paper:#FFFDF4; --paper-2:#FFF6E2; --ink:#3A3226; --ink-2:#7A6E5C;
  --c-yellow:#FFD84D; --c-orange:#FF9F45; --c-red:#FF6B6B; --c-pink:#FFB3C7;
  --c-green:#7BC96F; --c-teal:#4CC9B0; --c-blue:#5AB0F5; --c-purple:#B088F9;
  --c-brown:#C89B6A; --line:#3A3226;
  --font-title:"圆体-简","Yuanti SC","站酷快乐体2016修订版","PingFang SC",sans-serif;
  --font-hand:"娃娃体-简","仓耳渔阳体","HanziPen SC","PingFang SC",sans-serif;
  --font-body:"圆体-简","Yuanti SC","PingFang SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:1920px;overflow:hidden}
body{
  background:#EAE4D6;
  font-family:var(--font-body);
  color:var(--ink);
}
/* ============ 舞台：1920x1080 ============ */
#stageWrap{width:1920px;height:1080px;flex:none}
.stage{
  position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(120% 90% at 12% 8%, #FFFDF6 0%, #FFF9EC 45%, #FFF4E0 100%);
}
/* 纸纹噪点 */
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23g)'/></svg>");
  opacity:.10;mix-blend-mode:multiply;
}
/* 淡点阵（作业本感） */
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(58,50,38,.09) 1.6px, transparent 1.7px);
  background-size:40px 40px;opacity:.5;
}
.slide{position:absolute;inset:0;display:none;z-index:2}
.slide.on{display:block}
/* 贴纸卡：白边 + 硬阴影 + 微旋转 */
.sticker{
  position:relative;background:#FFFDF8;
  border-radius:26px 30px 26px 32px;
  box-shadow:9px 11px 0 rgba(58,50,38,.13), 0 3px 0 rgba(58,50,38,.05);
  padding:22px;
}
.sticker::before{
  content:"";position:absolute;inset:-7px;border-radius:32px 36px 32px 38px;
  background:#FFFDF8;z-index:-1;
}
/* 手绘标题 */
.title{font-family:var(--font-title);font-weight:700;color:var(--ink);
  letter-spacing:.02em;line-height:1.06}
/* 荧光笔高亮（文字下层） */
.hl{position:relative;z-index:0;display:inline-block;padding:0 .04em}
.hl>i{
  position:absolute;z-index:-1;left:-.05em;right:-.05em;bottom:.06em;height:.40em;
  background:var(--hl,var(--c-yellow));opacity:.92;
  border-radius:58% 42% 47% 53% / 70% 55% 45% 60%;
  transform:rotate(-1.4deg);
}
.hl>u{
  position:absolute;z-index:-1;left:.02em;right:-.08em;bottom:.14em;height:.30em;
  background:var(--hl,var(--c-yellow));opacity:.35;
  border-radius:45% 55% 60% 40% / 55% 50% 50% 45%;
  transform:rotate(1.2deg);text-decoration:none;
}
/* 页眉 / 页脚 */
.hdr{position:absolute;left:76px;top:58px;display:flex;align-items:center;gap:20px}
.hdr .badge{
  font-family:var(--font-hand);font-size:40px;color:#8A5A2B;
  background:var(--c-yellow);padding:10px 30px;border-radius:999px;
  transform:rotate(-2deg);box-shadow:4px 5px 0 rgba(58,50,38,.14);
}
.hdr .pno{font-family:var(--font-hand);font-size:36px;color:var(--ink-2)}
.foot{
  position:absolute;left:0;right:0;bottom:44px;
  display:flex;align-items:center;justify-content:center;gap:26px;
  font-family:var(--font-hand);font-size:31px;color:var(--ink-2);
}
.foot .brand{
  font-family:var(--font-title);font-weight:700;font-size:34px;color:var(--ink);
  background:#FFF;border:3px solid var(--ink);border-radius:999px;
  padding:6px 26px;box-shadow:4px 5px 0 rgba(58,50,38,.16);transform:rotate(-1deg);
}
</style>
<!--
  ============================================================
  横版课件封面（1920×1080），与《封面模板_竖版视频号_1080x1260.html》成对使用。
  本版为 2026-10-14 按 L8 成品实测回填：**内容占画布 93%（旧版 78%）**，含钩子句槽位。
  换课只改 4 处（搜索 【替换】）：
    ① 顶部徽章：课号 + 年级
    ② 主标题（荧光笔高亮词；**字号按词数给**：2 字 206 / 3 字 176 / 4 字 150；
       两个词用 0.6 倍字号的连接字分隔，如「与」「·」）
    ③ 副标题（≤14 字，目标宽 900–1050px；下面带手绘波浪线）
    ④ 钩子句（娃娃体 58px，≤16 字，压在主标题上方——封面最抓人的一句；不写就把这一行删掉）
  底部品牌行固定不改。
  ⛔ 三张贴纸卡：`width:300px` + 内边距自适应高（**别用固定 266×294**），
     卡下说明 32px；**插画必须按本课主题重画**（模板里的样例是 L8 的分类/搜索，
     照抄就会变成"一课一样"）。
  尺寸自检：渲染后量「内容外接框 / 画布」应 ≥90%（<85% 说明标题太小或卡片太挤）。
  截图出图：对 #stage 元素截图（1920×1080）。
  ============================================================
-->
</head><body>
<div id="stageWrap"><div class="stage">
<section class="slide on">

      <g stroke="#3A3226" stroke-width="5">
        <path d="M150 58 v-24"/><path d="M150 266 v24"/><path d="M58 150 H34"/><path d="M242 150 h24"/>

  <div class="hdr" style="left:262px">
    <span class="badge">AI 启蒙 · 第 X 课</span>   <!-- 【替换①】 -->
    <span class="pno">适合 小学 1–2 年级</span>
  </div>

  <div style="position:absolute;left:0;right:0;top:170px;text-align:center;z-index:4">
    <div style="font-family:var(--font-hand);font-size:58px;color:var(--ink-2)">【替换④】一句话钩子（≤16 字）</div>
    <div class="title" style="font-size:150px;margin-top:6px">
      <span class="hl" style="--hl:var(--c-yellow)">关键词A<i></i><u></u></span><span style="font-size:92px;vertical-align:18px"> 与 </span><span class="hl" style="--hl:var(--c-green)">关键词B<i></i><u></u></span>
    </div>
    <div style="margin-top:26px;position:relative;display:inline-block">
      <span class="title" style="font-size:72px">【替换③】副标题（≤14 字）</span>

           viewBox="0 0 600 26" preserveAspectRatio="none">
        <path d="M4 16 q40-14 82 0 t82 0 t82 0 t82 0 t82 0 t82 0"
              fill="none" stroke="#4CC9B0" stroke-width="7" stroke-linecap="round"/>

    </div>
  </div>

  <div style="position:absolute;left:0;right:0;top:636px;display:flex;justify-content:center;
              align-items:flex-end;gap:58px;z-index:4">
    <!-- 【替换②】卡1 插画（必须按本课主题重画；样例是 L8 的）-->
    <div class="sticker" style="width:300px;padding:12px 12px 6px;transform:rotate(-5deg)">
      <svg viewBox="0 0 300 300" style="width:100%;height:235px;display:block">
        <g filter="url(#wob)">
          <circle cx="66" cy="52" r="24" fill="#FF6B6B" stroke="#3A3226" stroke-width="6"/>
          <rect x="122" y="28" width="46" height="46" rx="8" fill="#5AB0F5" transform="rotate(14 145 51)" stroke="#3A3226" stroke-width="6"/>
          <path d="M212 66 L242 20 L272 66 Z" fill="#FFD84D" transform="rotate(-10 242 43)" stroke="#3A3226" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="150" cy="104" r="20" fill="#FFB3C7" stroke="#3A3226" stroke-width="6"/>
        </g>

        <g filter="url(#wob)">
          <rect x="24" y="196" width="112" height="70" rx="14" fill="#FFD84D" stroke="#3A3226" stroke-width="7"/>
          <circle cx="80" cy="231" r="23" fill="#FF6B6B" stroke="#3A3226" stroke-width="6"/>
          <rect x="164" y="196" width="112" height="70" rx="14" fill="#5AB0F5" stroke="#3A3226" stroke-width="7"/>
          <path d="M196 232 L226 202 L256 232 Z" fill="#FFD84D" stroke="#3A3226" stroke-width="6" stroke-linejoin="round"/>

      </svg>
      <div style="text-align:center;font-family:var(--font-hand);font-size:32px;margin:8px 0 6px">【替换②】卡1 说明</div>
    </div>
    <!-- 【替换②】卡2 插画 -->
    <div class="sticker" style="width:300px;padding:12px 12px 6px;transform:rotate(1.5deg);z-index:2">
      <svg viewBox="0 0 300 300" style="width:100%;height:235px;display:block">
        <g opacity=".38">
          <circle cx="58" cy="58" r="22" fill="#B8AE9C" stroke="#3A3226" stroke-width="6"/>
          <rect x="112" y="34" width="44" height="44" rx="8" fill="#B8AE9C" transform="rotate(12 134 56)" stroke="#3A3226" stroke-width="6"/>

        </g>
      </svg>
      <div style="text-align:center;font-family:var(--font-hand);font-size:32px;margin:8px 0 6px">【替换②】卡2 说明</div>
    </div>
    <!-- 【替换②】卡3 插画 -->
    <div class="sticker" style="width:300px;padding:12px 12px 6px;transform:rotate(5deg)">
      <svg viewBox="0 0 300 300" style="width:100%;height:235px;display:block">
        <g filter="url(#wob)">
          <!-- 大钟 + 钟下的铅笔 -->
          <circle cx="150" cy="150" r="74" fill="#FFF7E0" stroke="#3A3226" stroke-width="8"/>
          <path d="M150 108 v44 l30 20" fill="none" stroke="#3A3226" stroke-width="8" stroke-linecap="round"/>
          <rect x="76" y="238" width="148" height="18" rx="9" fill="#A87A4E" stroke="#3A3226" stroke-width="5"/>
          <g transform="rotate(-14 150 252)">
            <rect x="104" y="244" width="86" height="16" rx="8" fill="#FFD84D" stroke="#3A3226" stroke-width="5"/>
            <path d="M102 252 l-16 8 17 7 z" fill="#FF9F45" stroke="#3A3226" stroke-width="4" stroke-linejoin="round"/>
          </g>
        </g>
        <!-- 特征标签泡泡 -->
        <g filter="url(#wob)">
          <rect x="18" y="42" width="122" height="44" rx="22" fill="#FFB3C7" stroke="#3A3226" stroke-width="6"/>
          <text x="79" y="72" text-anchor="middle" font-size="26" fill="#3A3226" font-family="娃娃体-简,PingFang SC">圆圆的</text>
          <path d="M96 86 l-10 20 22-12 z" fill="#FFB3C7" stroke="#3A3226" stroke-width="5" stroke-linejoin="round"/>

</body></html>
