<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>风格演示 · 中性母题</title>
<!-- 中性层：只写版式（栅格/间距/热区/层级），不写颜色、字体、圆角、描边、阴影、纹理 -->
<style>
  :root{
    --sp-1:6px; --sp-2:10px; --sp-3:16px; --sp-4:24px; --sp-5:36px; --sp-6:52px;
    --tap:88px;                     /* 触摸热区下限（K-2：手指粗、动作大） */
    --stage-w:960px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    /* 中性层只管排布与节奏；所有视觉值来自风格包 tokens */
    padding:var(--sp-5) var(--sp-4) var(--sp-6);
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:var(--stage-w); display:flex; flex-direction:column; gap:var(--sp-5)}

  /* ── 顶部品牌行（中性结构：左 chip + 标题 + 右进度）── */
  .brand-row{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap}
  .chip{display:inline-flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); min-height:44px}
  .brand{display:inline-flex; align-items:center; gap:var(--sp-2); margin-left:auto; padding:var(--sp-2) var(--sp-3)}
  .progress{display:inline-flex; gap:var(--sp-1); align-items:center}
  .progress .seg{width:34px; height:14px}
  .progress .seg--on{}

  /* ── 母题 A：任务卡（可拖排序）── */
  .frame{display:flex; flex-direction:column; gap:var(--sp-4)}
  .frame__head{display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap}
  .title{margin:0; line-height:1.25}
  .task-line{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap}
  .card-row{display:flex; gap:var(--sp-4); align-items:stretch; flex-wrap:wrap; justify-content:center}
  .card{
    flex:1 1 240px; min-width:220px; min-height:var(--tap);
    display:flex; align-items:center; justify-content:center; gap:var(--sp-3);
    padding:var(--sp-4) var(--sp-3); cursor:grab; touch-action:none; user-select:none;
    position:relative;
  }
  .card:active{cursor:grabbing}
  .card__num{width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; flex:none}
  .card__label{line-height:1.3}
  .card--sel{}
  .card--ok{}
  .card--err{}
  .card--ghost{opacity:.35}
  .slot-line{display:flex; align-items:center; gap:var(--sp-2); justify-content:center; min-height:40px}

  /* ── 母题 B：对话（气泡 + 角色标签）── */
  .dialog{display:flex; flex-direction:column; gap:var(--sp-3); align-items:flex-start}
  .bubble{
    display:flex; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4); min-height:64px;
    align-items:flex-start; max-width:min(88%,620px); width:fit-content;
  }
  .bubble--s{margin-left:auto; flex-direction:row-reverse}
  .bubble__who{flex:none; padding:2px 10px; white-space:nowrap}
  .bubble__text{line-height:1.55}

  /* ── 反馈 / 提示 / 按钮（中性：位置与尺寸；皮肤：视觉）── */
  .feedback{display:flex; align-items:center; gap:var(--sp-2); min-height:52px; padding:var(--sp-2) var(--sp-4);
            width:fit-content; max-width:100%}
  .hint{display:inline-flex; align-items:center; gap:var(--sp-2); padding:var(--sp-1) var(--sp-2)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
    min-height:var(--tap); min-width:170px; padding:var(--sp-2) var(--sp-4);
    cursor:pointer; font:inherit;
  }
  .btn--ghost{min-width:130px}
  .actions{display:flex; gap:var(--sp-3); flex-wrap:wrap; align-items:center}
  .panel{padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-4)}
  .footer{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; justify-content:space-between;
          padding-top:var(--sp-4)}
  .footer .brand{margin:0}
  .stage-stack{display:flex; flex-direction:column; gap:var(--sp-4)}
  .pack-switch{display:flex; gap:var(--sp-2); flex-wrap:wrap}
  .pack-switch a{padding:6px 14px; text-decoration:none; min-height:40px; display:inline-flex; align-items:center}
</style>
<link id="pack" rel="stylesheet" href="../style-packs/pixel/pack.css">
<script>/* 中性页：只负责"选哪个 pack"，不写任何视觉 */
  (function(){var m=/[?&]style=([a-z]+)/.exec(location.search);
    if(m) document.getElementById("pack").href="../style-packs/"+m[1]+"/pack.css";})();
</script>
</head>
<body>
<div class="app">

  <header class="brand-row">
    <span class="chip">AI 启蒙 · 第 9 课</span>
    <span class="chip">推理 · 算法</span>
    <span class="chip">适合 小学 1–2 年级</span>
    <span class="progress" title="本关进度">
      <i class="seg seg--on"></i><i class="seg seg--on"></i><i class="seg"></i>
    </span>
    <span class="brand">小贤 AI 青少年教育</span>
  </header>

  <!-- 母题 A：排顺序（可拖） -->
  <section class="panel frame">
    <div class="frame__head">
      <h1 class="title">第三关 · 排好顺序</h1>
      <span class="pill">任务：把三张卡按做蛋糕的顺序排好</span>
    </div>

    <div class="card-row" id="row">
      <div class="card" data-key="egg"><span class="card__num">2</span><span class="card__label">加鸡蛋</span></div>
      <div class="card" data-key="flour"><span class="card__num">1</span><span class="card__label">倒面粉</span></div>
      <div class="card" data-key="oven"><span class="card__num">3</span><span class="card__label">烤一烤</span></div>
    </div>

    <div class="slot-line"><span class="hint">提示：按住卡片拖动，或点两张卡交换位置</span></div>

    <div class="feedback" id="fb" aria-live="polite"><span class="hint">还没有提交</span></div>

    <div class="actions">
      <button class="btn" id="check">检查我的顺序</button>
      <button class="btn btn--ghost" id="reset">重来</button>
      <span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span>
    </div>
  </section>

  <!-- 母题 B：对话 -->
  <section class="panel dialog">
    <div class="bubble bubble--t">
      <span class="bubble__who">老师</span>
      <span class="bubble__text">顺序错了，会怎么样？</span>
    </div>
    <div class="bubble bubble--s">
      <span class="bubble__who">学生</span>
      <span class="bubble__text">先烤，再加鸡蛋……那就变成一块硬饼啦！</span>
    </div>
    <div class="feedback"><span class="hint">轮到你：先做什么？大声说出来，再往下看 ↓</span></div>
  </section>

  <footer class="footer">
    <span class="brand">小贤 AI 青少年教育</span>
    <span class="hint">体系课程 · 实训项目 · AI 创造力</span>
    <span class="pack-switch" id="packSwitch"></span>
  </footer>

</div>

<script>
/* 中性交互层：只切状态类（.card--sel / --ghost / --ok / --err、.feedback--ok / --err），不写样式 */
(function () {
  const row = document.getElementById('row');
  const fb = document.getElementById('fb');
  const RIGHT = ['flour', 'egg', 'oven'];
  let sel = null, drag = null, stars = 0, suppressClick = false;

  const cards = () => [...row.querySelectorAll('.card')];
  const keyOrder = () => cards().map(c => c.dataset.key);

  function setFb(kind, html) {
    fb.className = 'feedback' + (kind ? ' feedback--' + kind : '');
    fb.innerHTML = html;
  }
  function clearStates() { cards().forEach(c => c.classList.remove('card--ok', 'card--err', 'card--sel')); sel = null; }

  function swap(a, b) {
    if (!a || !b || a === b) return;
    const marker = document.createElement('i');
    row.insertBefore(marker, a);
    row.insertBefore(a, b);
    row.insertBefore(b, marker);
    row.removeChild(marker);
  }

  // 点选两张交换
  row.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    const c = e.target.closest('.card'); if (!c || drag) return;
    if (!sel) { sel = c; c.classList.add('card--sel'); setFb(null, '<span class="hint">选中了一张，再点另一张交换</span>'); return; }
    if (sel === c) { c.classList.remove('card--sel'); sel = null; setFb(null, '<span class="hint">取消选择</span>'); return; }
    swap(sel, c); clearStates(); setFb(null, '<span class="hint">交换好了，点「检查我的顺序」看看对不对</span>');
  });

  // 按住拖动（指针事件，触摸可用）
  row.addEventListener('pointerdown', e => {
    const c = e.target.closest('.card'); if (!c) return;
    drag = { el: c, x: e.clientX, y: e.clientY, moved: false };
    c.setPointerCapture(e.pointerId);
  });
  row.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return;
    drag.moved = true; drag.el.style.transform = `translate(${dx}px,${dy}px)`;
    drag.el.classList.add('card--ghost');
  });
  row.addEventListener('pointerup', e => {
    if (!drag) return;
    const el = drag.el, moved = drag.moved;
    el.style.transform = ''; el.classList.remove('card--ghost');
    if (moved) {
      const r = el.getBoundingClientRect();
      const target = cards().find(c => c !== el && (() => { const q = c.getBoundingClientRect();
        return r.left < q.right && r.right > q.left; })());
      swap(el, target); setFb(null, '<span class="hint">放好了，点「检查我的顺序」</span>');
      drag = null; suppressClick = true; e.stopPropagation(); return;
    }
    drag = null;   // 没移动 → 交给 click 处理（点选交换）
  });

  document.getElementById('check').addEventListener('click', () => {
    const ok = keyOrder().join() === RIGHT.join();
    clearStates();
    if (ok) {
      cards().forEach(c => c.classList.add('card--ok'));
      setFb('ok', '<b>✓ 顺序完全正确！</b><span class="hint">先倒面粉 → 再加鸡蛋 → 最后烤一烤</span>');
      stars = 3; ['s1', 's2', 's3'].forEach(id => document.getElementById(id).classList.add('star--on'));
    } else {
      cards().forEach((c, i) => c.classList.add(c.dataset.key === RIGHT[i] ? 'card--ok' : 'card--err'));
      setFb('err', '<b>✗ 还差一点</b><span class="hint">绿色的位置对了，红色的再想想 —— 不扣分，再试一次</span>');
      stars = Math.max(stars, 1); document.getElementById('s1').classList.add('star--on');
    }
  });

  document.getElementById('reset').addEventListener('click', () => {
    location.reload();
  });

  // pack 切换（演示用；正式产品由 URL 决定）
  const packs = ['pixel', 'watercolor', 'crayon'];
  document.getElementById('packSwitch').innerHTML = packs.map(p =>
    `<a href="?style=${p}" class="hint">${p}</a>`).join('');
})();
</script>
</body>
</html>
