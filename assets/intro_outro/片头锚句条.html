<!DOCTYPE html>
<!-- 片头锚句字幕条 1920×1080 透明底（渲染时 omitBackground）
     叠加在正片开场 0~3.2s；徽章正片画面里已有，此处不重复。
     【替换】点：无（锚句为全系列固定文案） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; overflow:hidden; position:relative;
         font-family:"圆体-简","PingFang SC",sans-serif; background:transparent; }
  .anchor { position:absolute; left:50%; transform:translateX(-50%); bottom:170px;
            background:rgba(255,255,255,.94); border:5px solid #1D2D49; border-radius:26px;
            padding:20px 46px; font-size:40px; font-weight:700; color:#1D2D49;
            box-shadow:none; white-space:nowrap; }
  .anchor .em { color:#D85A30; }
</style>
</head>
<body>
  <div class="anchor">5–8 岁的 AI 课，可以这样上——<span class="em">家长和娃一起玩，老师拿来就能上。</span></div>
</body>
</html>
